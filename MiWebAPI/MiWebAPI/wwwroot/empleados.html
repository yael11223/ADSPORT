<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>CRUD de empleados</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="css/styles.css">
</head>
<body>
  <nav class="navbar navbar-expand-lg navbar-dark bg-primary shadow-sm">
    <div class="container">
      <a class="navbar-brand mb-0 h1" href="index.html">CRUD de empleados</a>
      <div class="d-flex gap-2">
        <a class="btn btn-outline-light btn-sm" href="index.html">Inicio</a>
        <button class="btn btn-light btn-sm" onclick="cerrarSesion()">Cerrar sesión</button>
      </div>
    </div>
  </nav>

  <main class="container py-4">
    <div id="mensaje" class="alert d-none" role="alert"></div>

    <div class="row g-4">
      <section class="col-lg-4">
        <div class="card shadow-sm sticky-lg-top form-card">
          <div class="card-body">
            <h2 id="tituloFormulario" class="h4 mb-3">Nuevo empleado</h2>

            <form id="formEmpleado">
              <input type="hidden" id="idEmpleado" value="0">

              <div class="mb-3">
                <label for="nombreCompleto" class="form-label">Nombre completo</label>
                <input type="text" class="form-control" id="nombreCompleto" required maxlength="100">
              </div>

              <div class="mb-3">
                <label for="correo" class="form-label">Correo</label>
                <input type="email" class="form-control" id="correo" required maxlength="100">
              </div>

              <div class="mb-3">
                <label for="sueldo" class="form-label">Sueldo</label>
                <input type="number" class="form-control" id="sueldo" required min="0" step="0.01">
              </div>

              <div class="mb-4">
                <label for="fechaContrato" class="form-label">Fecha de contratación</label>
                <input type="date" class="form-control" id="fechaContrato" required>
              </div>

              <div class="d-grid gap-2 d-sm-flex">
                <button type="submit" id="btnGuardar" class="btn btn-primary flex-grow-1">
                  Guardar
                </button>
                <button type="button" id="btnCancelar" class="btn btn-outline-secondary d-none">
                  Cancelar
                </button>
              </div>
            </form>
          </div>
        </div>
      </section>

      <section class="col-lg-8">
        <div class="card shadow-sm">
          <div class="card-body">
            <div class="d-flex flex-column flex-md-row justify-content-between gap-3 mb-3">
              <div>
                <h1 class="h3 mb-1">Lista de empleados</h1>
                <p class="text-secondary mb-0">Datos obtenidos desde la API de .NET.</p>
              </div>
              <button id="btnRecargar" class="btn btn-outline-primary align-self-md-start">
                Recargar
              </button>
            </div>

            <div class="input-group mb-3">
              <span class="input-group-text">Buscar</span>
              <input id="txtFiltro" type="search" class="form-control"
                     placeholder="Nombre o correo">
            </div>

            <div class="table-responsive">
              <table class="table table-hover align-middle">
                <thead class="table-primary">
                  <tr>
                    <th>Nombre completo</th>
                    <th>Correo</th>
                    <th class="text-end">Sueldo</th>
                    <th>Fecha</th>
                    <th class="text-center">Acciones</th>
                  </tr>
                </thead>
                <tbody id="tablaEmpleados"></tbody>
              </table>
            </div>

            <div id="sinResultados" class="text-center text-secondary py-4 d-none">
              No se encontraron empleados.
            </div>
          </div>
        </div>
      </section>
    </div>
  </main>

  <script src="js/auth.js"></script>
  <script>protegerPagina();</script>
  <script src="js/config.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
