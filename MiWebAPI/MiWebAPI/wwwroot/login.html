<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Iniciar sesión | Sistema de empleados</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="css/styles.css">
</head>
<body class="login-page d-flex align-items-center justify-content-center p-3">
  <main class="card login-card shadow-lg border-0">
    <div class="card-body p-4 p-md-5">
      <div class="d-flex align-items-center gap-3 mb-4">
        <div class="login-logo">E</div>
        <div><h1 class="h3 mb-1">Iniciar sesión</h1><p class="text-secondary mb-0">Sistema de empleados</p></div>
      </div>
      <div id="mensajeLogin" class="alert alert-danger d-none" role="alert"></div>
      <form id="formLogin">
        <div class="mb-3">
          <label for="correo" class="form-label">Correo electrónico</label>
          <input id="correo" type="email" class="form-control form-control-lg" value="admin@demo.com" required autocomplete="username">
        </div>
        <div class="mb-4">
          <label for="password" class="form-label">Contraseña</label>
          <input id="password" type="password" class="form-control form-control-lg" value="Admin123*" required autocomplete="current-password">
        </div>
        <button id="btnLogin" type="submit" class="btn btn-primary btn-lg w-100">Ingresar</button>
      </form>
      <div class="alert alert-light border mt-4 mb-0 small">
        <strong>Acceso de demostración</strong><br>Correo: admin@demo.com<br>Contraseña: Admin123*
      </div>
    </div>
  </main>
  <script src="js/login.js"></script>
</body>
</html>
