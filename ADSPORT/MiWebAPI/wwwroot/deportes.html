<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#090909">
    <title>Gestión de Deportes | Admin ADSPORT</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="css/Perfil.css">
    <link rel="stylesheet" href="/css/componentes.css">
</head>
<body class="profile-page" style="background-color: #090909; color: #fff;">
    <!-- BARRA DE NAVEGACIÓN ADMINISTRATIVA -->
    <header class="border-bottom border-secondary py-3 px-4 d-flex justify-content-between align-items-center" style="background-color: #0d0d0d;">
        <div class="d-flex align-items-center gap-3">
            <a href="index.html" class="text-decoration-none d-flex align-items-center gap-2">
                <span class="badge fw-bold fs-6" style="background-color: #ff6b00; color: #fff;">A</span>
                <div>
                    <div class="fw-bold text-white lh-1">ADSPORT</div>
                    <small style="color: #ff6b00; font-size: 0.7rem;">CATÁLOGO DE DEPORTES</small>
                </div>
            </a>
        </div>

        <nav class="d-flex align-items-center gap-2">
            <a href="index.html" class="btn btn-sm btn-outline-light">← Inicio</a>
            <a href="empleados.html" class="btn btn-sm btn-outline-light">Empleados</a>
            <a href="indexUsuario.html" target="_blank" class="btn btn-sm btn-outline-warning">Ver Catálogo Público</a>
            <button type="button" id="btnCerrarSesion" class="btn btn-sm btn-danger">Cerrar sesión</button>
        </nav>
    </header>

    <main class="container py-5">
        <div class="row g-4">
            <!-- FORMULARIO DE REGISTRO / EDICIÓN (SOLO ADMINISTRADOR) -->
            <div class="col-lg-4">
                <div class="profile-card">
                    <h3 class="section-title mb-3" id="tituloFormulario">REGISTRAR DEPORTE</h3>

                    <div id="alertaApi" class="alert d-none" role="alert"></div>

                    <form id="formDeporte" novalidate>
                        <input type="hidden" id="idDeporte" value="0">

                        <div class="mb-3">
                            <label for="nombreDeporte" class="form-label modal-label">Nombre del deporte *</label>
                            <input type="text" class="form-control modal-input" id="nombreDeporte" maxlength="50" placeholder="Ej. Tenis, Boxeo, Natación" required>
                        </div>

                        <div class="mb-3">
                            <label for="descripcion" class="form-label modal-label">Descripción *</label>
                            <textarea class="form-control modal-input" id="descripcion" rows="3" maxlength="100" placeholder="Breve descripción de la disciplina" required></textarea>
                        </div>

                        <div class="mb-3">
                            <label for="imagenDeporte" class="form-label modal-label">Imagen del deporte (JPG, PNG, WEBP)</label>
                            <input type="file" class="form-control modal-input" id="imagenDeporte" accept=".jpg,.jpeg,.png,.webp">
                            <div id="contenedorPreview" class="mt-2 d-none text-center">
                                <img id="previewImagenDeporte" src="" alt="Vista previa" style="width: 100%; max-height: 150px; object-fit: cover; border-radius: 8px; border: 1px solid #ff6b00;">
                            </div>
                        </div>

                        <div class="d-grid gap-2">
                            <button type="submit" class="btn-modal-submit" id="btnGuardar">GUARDAR DEPORTE</button>
                            <button type="button" class="btn btn-outline-light d-none" id="btnCancelar">Cancelar Edición</button>
                        </div>
                    </form>
                </div>
            </div>

            <!-- TABLA DE CATÁLOGO DE DEPORTES -->
            <div class="col-lg-8">
                <div class="profile-card">
                    <div class="d-flex justify-content-between align-items-center mb-3">
                        <h3 class="section-title mb-0">CATÁLOGO DE DEPORTES</h3>
                        <span class="badge bg-warning text-dark" id="totalRegistros">0 registros</span>
                    </div>

                    <div class="table-responsive">
                        <table class="table table-dark table-striped table-hover align-middle mb-0">
                            <thead>
                                <tr>
                                    <th>ID</th>
                                    <th>Imagen</th>
                                    <th>Deporte</th>
                                    <th>Descripción</th>
                                    <th>Última Modificación</th>
                                    <th class="text-center">Acciones</th>
                                </tr>
                            </thead>
                            <tbody id="tablaDeportesBody">
                                <tr>
                                    <td colspan="6" class="text-center text-muted">Cargando deportes...</td>
                                </tr>
                            </tbody>
                        </table>
                    </div>
                </div>
            </div>
        </div>
    </main>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="/js/auth.js"></script>
    <script src="/js/deportes.js"></script>
    <script>
                document.getElementById("btnCerrarSesion")?.addEventListener("click", () => {
                    sessionStorage.clear();
                    localStorage.clear();
                    window.location.replace("login.html");
                });
    </script>
</body>
</html>
